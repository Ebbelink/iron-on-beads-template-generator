trigger:
  branches:
    include:
      - '*'

variables:
  IMAGE_NAME: ghcr.io/$(GHCR_USERNAME)/iron-on-beads-template-generator
  CONFIGURATION_ITEM: START-TO-SCALE-IT-MISC-BEADS
  # Auto-incrementing patch counter, resets only if you change the seed
  PATCH_VERSION: '0'
  MAJOR_VERSION: '1'
  MINOR_VERSION: $[counter('release-version', 0)]

stages:
  - stage: Build
    displayName: Build & Push Docker image
    jobs:
      - job: BuildAndPush
        displayName: Build and push to GHCR
        pool:
          vmImage: ubuntu-latest

        steps:
          - checkout: self

          - script: |
              echo "$(GHCR_TOKEN)" | docker login ghcr.io \
                --username "$(GHCR_USERNAME)" \
                --password-stdin
            displayName: Log in to GHCR

          - bash: |
              if [ "$(Build.SourceBranchName)" = "main" ]; then
                IMAGE_TAG="$(MAJOR_VERSION).$(MINOR_VERSION).$(PATCH_VERSION)"
              else
                IMAGE_TAG=$(date -u +'%Y-%m-%dT%H-%M-%S')
              fi
              echo "Computed tag: $IMAGE_TAG"
              echo "##vso[task.setvariable variable=IMAGE_TAG;isOutput=true]$IMAGE_TAG"
            displayName: Determine image tag
            name: tagStep

          - script: |
              docker build -t $(IMAGE_NAME):$(IMAGE_TAG) -t $(IMAGE_NAME):latest .
            displayName: Build Docker image

          - script: |
              docker push $(IMAGE_NAME):$(IMAGE_TAG)
              docker push $(IMAGE_NAME):latest
            displayName: Push Docker image

          - script: docker logout ghcr.io
            displayName: Log out of GHCR
            condition: always()
  
  - stage: DeployDev
    displayName: Deploy to DEV
    dependsOn: Build
    condition: succeeded()
    variables:
      IMAGE_TAG: $[stageDependencies.Build.BuildAndPush.outputs['tagStep.IMAGE_TAG']]
    jobs:
      - deployment: DeployDev
        displayName: Provision infra and deploy (DEV)
        pool:
          vmImage: ubuntu-latest
        environment: START-TO-SCALE-IT-MISC-BEADS-DEV
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureResourceManagerTemplateDeployment@3
                  displayName: Deploy Bicep — DEV
                  inputs:
                    deploymentScope: 'Resource Group'
                    azureResourceManagerConnection: 'ARM-$(CONFIGURATION_ITEM)-DEV'
                    action: 'Create Or Update Resource Group'
                    resourceGroupName: 'RSG-$(CONFIGURATION_ITEM)-DEV'
                    location: 'westeurope'
                    templateLocation: 'Linked artifact'
                    csmFile: 'IronOnBeadsTemplateGenerator/infra.bicep'
                    overrideParameters: >
                      -containerAppName "$(CONFIGURATION_ITEM)-DEV"
                      -containerImage "$(IMAGE_NAME):$(IMAGE_TAG)"
                      -targetPort 8000
                    deploymentMode: 'Incremental'
                    deploymentName: '$(CONFIGURATION_ITEM)-DEV-$(Build.BuildId)'

  - stage: DeployPrd
    displayName: Deploy to PRD
    dependsOn: DeployDev
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
    variables:
      IMAGE_TAG: $[stageDependencies.Build.BuildAndPush.outputs['tagStep.IMAGE_TAG']]
    jobs:
      - deployment: DeployPrd
        displayName: Provision infra and deploy (PRD)
        pool:
          vmImage: ubuntu-latest
        environment: START-TO-SCALE-IT-MISC-BEADS-PRD
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureResourceManagerTemplateDeployment@3
                  displayName: Deploy Bicep — PRD
                  inputs:
                    deploymentScope: 'Resource Group'
                    azureResourceManagerConnection: 'ARM-$(CONFIGURATION_ITEM)-PRD'
                    action: 'Create Or Update Resource Group'
                    resourceGroupName: 'RSG-$(CONFIGURATION_ITEM)-PRD'
                    location: 'westeurope'
                    templateLocation: 'Linked artifact'
                    csmFile: 'IronOnBeadsTemplateGenerator/infra.bicep'
                    overrideParameters: >
                      -containerAppName "$(CONFIGURATION_ITEM)-PRD"
                      -containerImage "$(IMAGE_NAME):$(IMAGE_TAG)"
                      -targetPort 8000
                    deploymentMode: 'Incremental'
                    deploymentName: '$(CONFIGURATION_ITEM)-PRD-$(Build.BuildId)'